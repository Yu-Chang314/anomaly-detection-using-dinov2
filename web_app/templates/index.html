<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DINOv2 異常辨識</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel">
          <div>
            <p class="eyebrow">SSPTT / DINOv2</p>
            <h1>異常辨識</h1>
          </div>

          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept="image/*" />
            <span class="dropIcon">+</span>
            <span class="dropTitle">選擇或拖曳圖片</span>
            <span class="dropHint">PNG、JPG、JPEG</span>
          </label>

          <button id="predictButton" type="button" disabled>開始辨識</button>

          <dl class="statusGrid">
            <div>
              <dt>狀態</dt>
              <dd id="statusText">等待圖片</dd>
            </div>
            <div>
              <dt>分數</dt>
              <dd id="scoreText">-</dd>
            </div>
            <div>
              <dt>判定</dt>
              <dd id="labelText">-</dd>
            </div>
          </dl>
        </aside>

        <section class="results" aria-live="polite">
          <div class="resultHeader">
            <h2>輸出</h2>
            <span id="fileName">尚未選擇檔案</span>
          </div>

          <div class="imageGrid">
            <figure>
              <img id="originalImage" alt="原始圖片" />
              <figcaption>原圖</figcaption>
            </figure>
            <figure>
              <img id="overlayImage" alt="異常熱圖疊合" />
              <figcaption>疊合</figcaption>
            </figure>
            <figure>
              <img id="heatmapImage" alt="異常熱圖" />
              <figcaption>Heatmap</figcaption>
            </figure>
            <figure>
              <img id="maskImage" alt="預測遮罩" />
              <figcaption>Mask</figcaption>
            </figure>
          </div>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
